name: Agent safety regression tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MOCK_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal offline test dependencies
        run: python -m pip install "langgraph>=1.0,<2.0"
      - name: Run agent safety tests (mock tools, no external API)
        run: python -m unittest discover -s tests -v
